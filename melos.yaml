name: refreshi

useRootAsPackage: true

packages:
  - .

command:
  #melos clean is built in, the hook also wipes generated code and build output
  clean:
    hooks:
      post: flutter clean && find lib -type f \( -name '*.g.dart' -o -name '*.freezed.dart' -o -name '*.graphql.dart' -o -name '*.config.dart' \) -delete

scripts:
  #one command from a fresh clone: deps, generated code and the native folders
  setup:
    #plain commands, not nested melos calls, so it doesn't depend on how melos was launched
    run: flutter pub get && dart run build_runner build && flutter create --platforms=ios,android --empty .
    description: Install deps, generate code and create the ios/android folders

  get:
    run: flutter pub get
    description: Install dependencies

  build:
    run: dart run build_runner build
    description: Generate GraphQL types, freezed, json and injectable code

  auto-build:
    run: dart run build_runner watch
    description: Regenerate code on save

  platforms:
    run: flutter create --platforms=ios,android --empty .
    description: Create the ios and android folders (not committed)

  test:
    run: flutter test
    description: Run all tests

  web:
    run: flutter run -d chrome
    description: Run the app in Chrome
